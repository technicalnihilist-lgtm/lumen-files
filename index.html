<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

.g{position:relative;background:radial-gradient(120% 140% at 18% 0,rgba(255,255,255,calc(.12 + var(--lq)*.24)),rgba(255,255,255,0) 55%),rgba(255,255,255,var(--fa));backdrop-filter:blur(var(--bl)) saturate(calc(140% + var(--lq)*120%));-webkit-backdrop-filter:blur(var(--bl)) saturate(calc(140% + var(--lq)*120%));border:0;box-shadow:inset 0 0 calc(10px + var(--lq)*20px) rgba(255,255,255,calc(.05 + var(--lq)*.2)),inset 0 2px 1px rgba(255,255,255,calc(.3 + var(--lq)*.45)),inset 0 -2px 1px rgba(255,255,255,.2),inset 4px 0 8px -4px rgba(120,225,255,calc(var(--lq)*.9)),inset -4px 0 8px -4px rgba(255,150,215,calc(var(--lq)*.9)),0 10px 24px rgba(0,0,0,.18)}
.g::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 48%,transparent 60%);background-size:260% 100%;opacity:var(--lq);background-position:60% 0}.bar::after,.fab::after{animation:sheen 9s ease-in-out infinite}@keyframes sheen{from{background-position:130% 0}to{background-position:-30% 0}}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;opacity:calc(.4 + var(--lq)*.6);background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 28%,rgba(255,255,255,.05) 65%,rgba(255,255,255,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);max-width:720px;margin:0 auto}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.bar{margin:10px 12px 0;height:56px;border-radius:28px;display:flex;align-items:center;gap:4px;padding:0 8px}
.bar .ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.bar .ib:active,.ib:active{background:rgba(255,255,255,.25)}
.bar input{flex:1;min-width:0;background:none;border:0;outline:0;color:inherit;font:inherit;font-size:16px}
.bar input::placeholder{color:var(--mut)}
.bar .t{flex:1;font-weight:600;font-size:18px;padding-left:6px}

.crumbs button{flex:none;padding:6px 12px;border-radius:16px;font-size:14px;background:rgba(255,255,255,.14)}
.crumbs button:last-child{background:rgba(255,255,255,.3);font-weight:600}
#list{flex:1;overflow-y:auto;padding:8px 12px 110px}
.it{content-visibility:auto;contain-intrinsic-size:auto 66px;position:relative;display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:20px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.it:active{background:rgba(255,255,255,.14)}
.it.on{background:rgba(127,227,255,.2);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 0 18px rgba(255,255,255,.15),0 4px 14px rgba(0,0,0,.12)}
.ic{position:relative;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;letter-spacing:.3px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4);background:radial-gradient(120% 120% at 20% 0,rgba(255,255,255,.4),transparent 60%),rgba(255,255,255,.12);background:radial-gradient(120% 120% at 20% 0,rgba(255,255,255,.4),transparent 60%),color-mix(in srgb,var(--c) 34%,transparent);box-shadow:inset 0 0 16px rgba(255,255,255,.2),inset 0 2px 1px rgba(255,255,255,.7),inset 0 -2px 1px rgba(255,255,255,.22),inset 3px 0 6px -3px rgba(120,225,255,.8),inset -3px 0 6px -3px rgba(255,150,215,.8),0 6px 16px rgba(0,0,0,.14)}
.ic::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.1px;background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 30%,rgba(255,255,255,.05) 65%,rgba(255,255,255,.7));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ic::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.4) 48%,transparent 60%);background-size:260% 100%;opacity:var(--lq);background-position:60% 0}
.tx{min-width:0;flex:1}.tx b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx small{color:var(--mut);font-size:12.5px}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:none;display:none;place-items:center}
.sm .ck{display:grid}.it.on .ck{background:var(--acc);border-color:var(--acc)}
.it.on .ck::after{content:"";width:6px;height:11px;border:solid #06223a;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.gv #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px;align-content:start}
.gv .it{contain-intrinsic-size:auto 128px;flex-direction:column;text-align:center;gap:8px;padding:14px 6px}
.gv .ic{width:60px;height:60px;border-radius:18px}.gv .tx{width:100%}.gv .tx b{font-size:13.5px}
.gv .ck{position:absolute;top:8px;right:8px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:70px 20px}
.fab{position:absolute;right:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:22px;display:grid;place-items:center;z-index:5}
.fab svg{width:28px;height:28px}
.pop{position:fixed;z-index:30;min-width:200px;border-radius:22px;padding:6px;animation:morph .42s cubic-bezier(.2,1.2,.3,1);transform-origin:top right}
.pop button{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;font-size:15.5px}
.pop button:active{background:rgba(255,255,255,.22)}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,8,25,.3);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
#drawer{position:fixed;z-index:25;top:10px;bottom:10px;left:10px;width:min(300px,84vw);border-radius:30px;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 16px;transform:translateX(-112%);transition:transform .55s cubic-bezier(.22,1.15,.3,1);display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer h2{margin:4px 12px 14px;font-size:22px}
#drawer .row{display:flex;gap:14px;align-items:center;padding:13px 14px;border-radius:18px;width:100%;text-align:left;font-size:15.5px}
#drawer .row.act{background:rgba(255,255,255,.26);font-weight:600}
#drawer{overflow-y:auto;will-change:transform}.gs{margin:auto 12px 0;display:grid;gap:12px}.gs label{font-size:13.5px;color:var(--mut);display:grid;gap:4px}.gs label span{display:flex;justify-content:space-between}.gs input{width:100%;accent-color:#7fe3ff;height:28px;margin:0}.gs .sw input{width:22px;height:22px}.tr>span{font-size:13.5px;color:var(--mut)}.tr>div{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.tr button{padding:7px 12px;border-radius:14px;font-size:13.5px;background:rgba(255,255,255,.14)}.tr button.on{background:rgba(255,255,255,.34);font-weight:700;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}.meter{margin:14px 12px 4px}.meter i{display:block;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i b{display:block;height:100%;background:linear-gradient(90deg,#7fe3ff,#b79cff)}.meter small{color:var(--mut);display:block;margin-top:8px}
.snack,.pbar{position:fixed;left:12px;right:12px;max-width:520px;margin:0 auto;z-index:40;border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:10px;animation:rise .5s cubic-bezier(.2,1.2,.3,1)}
.snack{bottom:calc(98px + env(safe-area-inset-bottom,0px))}.snack span,.pbar span{flex:1}
.pbar{bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
.snack button,.pbar button{font-weight:700;color:var(--acc);padding:6px 10px;border-radius:12px}
.dlg{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;background:rgba(5,8,25,.35)}
.dlg>div{width:100%;max-width:340px;border-radius:30px;padding:22px 20px 12px;animation:morph .45s cubic-bezier(.2,1.2,.3,1)}
.dlg h3{margin:0 0 12px;font-size:19px}.dlg p{margin:0 0 6px;color:var(--mut);line-height:1.5;font-size:14.5px;word-break:break-word}
.dlg input{width:100%;padding:12px 14px;border-radius:16px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:inherit;font:inherit;font-size:16px;outline:0}
.dlg .ac{display:flex;justify-content:flex-end;gap:4px;margin-top:12px}.dlg .ac button{padding:10px 16px;border-radius:16px;font-weight:600}.dlg .ac .ok{color:var(--acc)}
@keyframes in{from{opacity:0;transform:scale(.96) translateY(6px)}}
.bn{animation:bounce .55s cubic-bezier(.2,.9,.3,1)}@keyframes bounce{0%{transform:scale(1)}22%{transform:scale(1.1,.93);filter:brightness(1.25)}50%{transform:scale(.97,1.04)}75%{transform:scale(1.015,.99)}100%{transform:scale(1)}}@keyframes morph{from{opacity:0;transform:scale(.35)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(46px) scale(.92)}to{opacity:1;transform:none}}@keyframes delbounce{0%{transform:scale(1);opacity:1}25%{transform:scale(1.07,.95)}50%{transform:scale(.92,1.04);opacity:1}100%{transform:scale(.25);opacity:0;filter:blur(8px)}}.bn[data-a=menu],.bn[data-a=more]{animation-name:dotsb;animation-duration:.6s}@keyframes dotsb{0%{transform:none}35%{transform:rotate(90deg) scale(1.28)}70%{transform:rotate(-14deg) scale(.94)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app">
 <div class="bar g" id="bar"></div>
 <div class="crumbs" id="crumbs"></div>
 <div id="list"></div>
 <button class="fab g" id="fab" aria-label="New"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="scrim" id="scrim"></div>
<aside class="g" id="drawer"></aside>
<script>
const $=s=>document.querySelector(s);
const P={menu:'M4 6h16M4 12h16M4 18h16',dots:'M12 5h.01M12 12h.01M12 19h.01',x:'M6 6l12 12M18 6L6 18',copy:'M9 9h11v11H9zM5 15V5h10',move:'M4 12h14M12 6l6 6-6 6',del:'M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13',back:'M15 5l-7 7 7 7',grid:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z',list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',all:'M3 12l5 5L18 7M12 17l1 1L22 8',home:'M4 11l8-7 8 7v9H4z',img:'M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4',vid:'M4 6h12v12H4zM16 10l5-3v10l-5-3',aud:'M9 18V6l10-2v12M9 18a3 3 0 11-3-3M19 16a3 3 0 11-3-3',doc:'M6 3h8l5 5v13H6zM14 3v5h5',dl:'M12 4v11M7 11l5 5 5-5M5 20h14',folder:'M3 6h7l2 2h9v11H3z'};
const ic=(k,s='')=>`<svg class="i" viewBox="0 0 24 24" ${s}><path d="${P[k]}"/></svg>`;
let uid=0;const N={};
const extOf=n=>n.includes('.')?n.split('.').pop().toLowerCase():'';
function mk(name,parent,dir,size=0){const n={id:++uid,name,parent,dir,size,mod:Date.now()-Math.random()*17*864e5,kids:dir?[]:null};N[n.id]=n;if(parent)N[parent].kids.push(n.id);return n.id}
const R=mk('Internal storage',0,1),F={};
const STD=['DCIM','Download','Documents','Music','Movies','Pictures'];
const FSKEY='lumen-fs';
function loadFS(){try{const d=JSON.parse(localStorage.getItem(FSKEY)||'null');
 if(!d||!Array.isArray(d.nodes)||!d.nodes.length)return false;
 d.nodes.forEach(n=>{if(!n||typeof n.id!=='number')return;N[n.id]=n;if(n.dir&&!Array.isArray(n.kids))n.kids=[];if(!n.dir)n.kids=null});
 if(!N[R])return false;
 Object.keys(N).forEach(k=>{const n=N[k];if(n.id!==R&&!N[n.parent])delete N[k]});
 uid=Object.values(N).reduce((a,n)=>Math.max(a,n.id),0);
 return true}catch(e){return false}}
if(!loadFS())STD.forEach(n=>F[n]=mk(n,R,1));
STD.forEach(n=>{const k=N[R].kids.map(i=>N[i]).find(x=>x&&x.dir&&x.name===n);F[n]=k?k.id:mk(n,R,1)});
function save(){try{localStorage.setItem(FSKEY,JSON.stringify({v:1,nodes:Object.values(N)}))}catch(e){}}
const CAT={img:['jpg','png','gif'],vid:['mp4','mkv'],aud:['mp3','wav'],doc:['pdf','docx','txt','xlsx']};
const CN={img:'Images',vid:'Videos',aud:'Audio',doc:'Documents'};
const COL={jpg:'#ff5f9e',png:'#ff5f9e',mp4:'#7a5cff',mkv:'#7a5cff',mp3:'#ff9d3d',wav:'#ff9d3d',pdf:'#ff4d5e',docx:'#3b82f6',txt:'#8b9bb4',xlsx:'#16c47f',apk:'#12c9a6',zip:'#e3b341'};
let cwd=R,cat=null,sel=new Set(),view='list',sort='name',q='',clip=null,searching=false;
const sz=id=>{const n=N[id];return n.dir?n.kids.reduce((a,k)=>a+sz(k),0):n.size};
const fmt=b=>b>=1e9?(b/1e9).toFixed(1)+' GB':b>=1e6?(b/1e6).toFixed(1)+' MB':b>=1e3?Math.round(b/1e3)+' KB':b+' B';
const dt=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function items(){let a;if(cat)a=Object.values(N).filter(n=>!n.dir&&n.parent&&CAT[cat].includes(extOf(n.name)));
 else if(q)a=Object.values(N).filter(n=>n.parent);
 else a=N[cwd].kids.map(k=>N[k]);
 if(q)a=a.filter(n=>n.name.toLowerCase().includes(q.toLowerCase()));
 const s={name:(x,y)=>x.name.localeCompare(y.name),date:(x,y)=>y.mod-x.mod,size:(x,y)=>sz(y.id)-sz(x.id)}[sort];
 return a.sort((x,y)=>(y.dir-x.dir)||s(x,y))}
const row=n=>`<div class="it ${sel.has(n.id)?'on':''}" data-id="${n.id}">${icon(n)}<div class="tx"><b>${esc(n.name)}</b><small>${n.dir?n.kids.length+' items':fmt(n.size)} · ${dt(n.mod)}</small></div><div class="ck"></div></div>`;
function icon(n){if(n.dir)return`<div class="ic" style="--c:#ffbf4a">${ic('folder','style="width:28px;height:28px;fill:rgba(255,255,255,.32)"')}</div>`;
 const e=extOf(n.name);return`<div class="ic" style="--c:${tint(e)}">${(e||'file').slice(0,4).toUpperCase()}</div>`}
const tint=e=>COL[e]||(e?`hsl(${[...e].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360} 85% 62%)`:'#8b9bb4');
function render(){const sm=sel.size>0;$('#app').className=(view==='grid'?'gv ':'')+(sm?'sm':'');
 const bar=$('#bar');
 if(sm)bar.innerHTML=`<button class="ib" data-a="clr">${ic('x')}</button><div class="t">${sel.size} selected</div><button class="ib" data-a="all">${ic('all')}</button><button class="ib" data-a="copy">${ic('copy')}</button><button class="ib" data-a="move">${ic('move')}</button><button class="ib" data-a="del">${ic('del')}</button><button class="ib" data-a="more">${ic('dots')}</button>`;
 else if(searching)bar.innerHTML=`<button class="ib" data-a="nosearch">${ic('back')}</button><input id="q" placeholder="Search files" value="${esc(q)}" autofocus><button class="ib" data-a="nosearch">${ic('x')}</button>`;
 else bar.innerHTML=`<button class="ib" data-a="drawer">${ic('menu')}</button><div class="t">${cat?CN[cat]:esc(N[cwd].name)}</div><button class="ib" data-a="search">${ic('doc','style="display:none"')}<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/></svg></button><button class="ib" data-a="view">${ic(view==='grid'?'list':'grid')}</button><button class="ib" data-a="menu">${ic('dots')}</button>`;
 const path=[];if(!cat){let c=cwd;while(c){path.unshift(c);c=N[c].parent}}
 $('#crumbs').innerHTML=cat?`<button>${CN[cat]}</button>`:path.map(id=>`<button data-go="${id}">${id===R?'Internal':esc(N[id].name)}</button>`).join('');
 const a=items();
 $('#list').innerHTML=a.length?a.map(row).join(''):`<div class="empty">${q?'No files match your search':'This folder is empty.<br>Tap + to add a file or folder.'}</div>`;
 const md=sm+'|'+searching;if(bar._m!==md){bar._m=md;if(!matchMedia('(prefers-reduced-motion:reduce)').matches)bar.animate([{opacity:.2,transform:'scale(.94)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.2,1.2,.3,1)'})}
 $('#fab').style.display=cat||sm?'none':'grid';save();
 let pb=$('#pbar');
 if(clip){if(!pb){pb=document.createElement('div');pb.id='pbar';pb.className='pbar g';document.body.append(pb)}
  const h=`<span>${clip.ids.length} to ${clip.mode}</span><button data-a="cancel">Cancel</button><button data-a="paste">Paste here</button>`;if(pb.innerHTML!==h)pb.innerHTML=h}
 else pb?.remove();
 if(searching&&!sm){const i=$('#q');if(i&&document.activeElement!==i){i.focus();i.setSelectionRange(99,99)}}
 drawer()}
function drawer(){const used=61.4e9+sz(R),cats=[['home','Internal storage',!cat&&cwd===R,'root'],['img','Images',cat==='img','img'],['vid','Videos',cat==='vid','vid'],['aud','Audio',cat==='aud','aud'],['doc','Documents',cat==='doc','doc'],['dl','Downloads',!cat&&cwd===F.Download,'dl']];
 $('#drawer').innerHTML=`<h2>Lumen Files</h2>${cats.map(c=>`<button class="row ${c[2]?'act':''}" data-d="${c[3]}">${ic(c[0])}${c[1]}</button>`).join('')}<div class="gs"><div class="tr"><span>Transition style</span><div>${TR.map((n,i)=>`<button data-x="${i}" class="${S.x===i?'on':''}">${n}</button>`).join('')}</div></div><label><span>Transparency<small>${S.t}%</small></span><input type="range" id="rt" min="0" max="100" value="${S.t}"></label><label><span>Liquid effect<small>${S.l}%</small></span><input type="range" id="rl" min="0" max="100" value="${S.l}"></label><label><span>Sound volume<small>${S.v}%</small></span><input type="range" id="rv" min="0" max="100" value="${S.v}"></label><label><span>Sound pitch<small>${S.p}%</small></span><input type="range" id="rp" min="0" max="100" value="${S.p}"></label><label><span>Transition speed<small>${S.sp}%</small></span><input type="range" id="rsp" min="50" max="250" value="${S.sp}"></label><label class="sw"><span>Animated glass<input type="checkbox" id="rm" ${S.m?'checked':''}></span></label><label class="sw"><span>Tap sound<input type="checkbox" id="rs" ${S.s?'checked':''}></span></label></div><div class="meter"><i><b style="width:${Math.min(100,used/128e9*100).toFixed(1)}%"></b></i><small>${fmt(used)} used of 128 GB</small></div>`}
function nav(id){const back=inside(id,cwd);cwd=id;cat=null;sel.clear();q='';searching=false;render();$('#list').scrollTop=0;trans(back)}
function toggle(id){sel.has(id)?sel.delete(id):sel.add(id);render();bounce($('.it[data-id="'+id+'"]'),1.35)}
// long press = select, tap = open (Android behaviour)
let lp=0,fired=0;
$('#list').addEventListener('pointerdown',e=>{const t=e.target.closest('.it');if(!t)return;fired=0;clearTimeout(lp);lp=setTimeout(()=>{fired=1;navigator.vibrate?.(12);toggle(+t.dataset.id)},420)});
['pointerup','pointercancel','pointermove','scroll'].forEach(ev=>$('#list').addEventListener(ev,()=>clearTimeout(lp),{passive:true}));
